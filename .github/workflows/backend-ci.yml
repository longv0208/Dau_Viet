name: backend-ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "dau-viet-backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "dau-viet-backend/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: backend verify (Java 21 + Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dau-viet-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Verify (unit + Testcontainers IT)
        run: ./mvnw -B -ntp verify
        # ubuntu-latest has Docker available for Testcontainers; no compose needed.

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-${{ github.run_id }}
          path: |
            dau-viet-backend/target/surefire-reports/
            dau-viet-backend/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14
