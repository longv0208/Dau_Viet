name: mobile-ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "dau-viet-mobile/**"
      - ".github/workflows/mobile-ci.yml"
  push:
    branches: [main]
    paths:
      - "dau-viet-mobile/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: mobile verify (Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: dau-viet-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Unit & widget tests
        run: flutter test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-reports-${{ github.run_id }}
          path: |
            dau-viet-mobile/coverage/
          if-no-files-found: ignore
          retention-days: 14
