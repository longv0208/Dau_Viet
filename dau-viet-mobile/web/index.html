<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Dấu Việt — Học Sử Việt, Gìn Giữ Hồn Việt.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Dấu Việt">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <!-- Google Sign-In Web: điền Web OAuth client id vào content bên dưới
       (…apps.googleusercontent.com) HOẶC truyền --dart-define=GOOGLE_WEB_CLIENT_ID
       khi flutter run/build — dart-define được ưu tiên hơn meta này.
       Để trống → google_sign_in_web không có client id và nút Google báo
       lỗi cấu hình rõ ràng thay vì crash. -->
  <meta name="google-signin-client_id" content="73221283418-jg0kuhf7j5j24mais237ief4qchdpbdd.apps.googleusercontent.com">


  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Dấu Việt — Học Sử Việt, Gìn Giữ Hồn Việt</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #FBF8F1;
      height: 100%;
    }
    #dv-boot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, #FFFBF4 0%, #FFF1D5 65%, #F3E0C0 100%);
      z-index: 9999;
      transition: opacity 0.35s ease;
      pointer-events: none;
    }
    #dv-boot-splash img {
      width: min(300px, 78vw);
      height: auto;
      filter: drop-shadow(0 6px 18px rgba(97, 59, 40, 0.14));
    }
  </style>
</head>
<body>
  <div id="dv-boot-splash">
    <img src="logo2.svg" alt="Dấu Việt — Học Sử Việt, Gìn Giữ Hồn Việt" />
  </div>
  <script>
    window.addEventListener("flutter-first-frame", function () {
      var el = document.getElementById("dv-boot-splash");
      if (el) {
        el.style.opacity = "0";
        setTimeout(function () { el.remove(); }, 400);
      }
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
