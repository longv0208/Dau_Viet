server:
  port: 8080
spring:
  servlet:
    multipart:
      # 16/18MB — self-contained HTML animation files cap at ~15MB (with
      # inline data-URI media), so the generic 10MB multipart cap is too small.
      max-file-size: 16MB
      max-request-size: 18MB
  application:
    name: dau-viet-backend
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: []
  seed:
    enabled: false
  security:
    # HS256 signing secret — set JWT_SECRET (>= 32 bytes) outside local dev.
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl-seconds: 900
    refresh-token-ttl-seconds: 1209600


dauviet:
  assets:
    # Local-dev upload dir; production swaps to object storage behind the same contentUrl.
    dir: ${DAUVIET_ASSETS_DIR:data/assets}
  animations:
    html:
      # Hard cap for self-contained .html uploads (15MB default).
      max-bytes: ${DAUVIET_ANIMATION_HTML_MAX_BYTES:15728640}
