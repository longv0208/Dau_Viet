server:
  port: 8080
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  application:
    name: dau-viet-backend
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: []
  seed:
    enabled: false
  security:
    # HS256 signing secret — set JWT_SECRET (>= 32 bytes) outside local dev.
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl-seconds: 900
    refresh-token-ttl-seconds: 1209600


dauviet:
  assets:
    # Local-dev upload dir; production swaps to object storage behind the same contentUrl.
    dir: ${DAUVIET_ASSETS_DIR:data/assets}
