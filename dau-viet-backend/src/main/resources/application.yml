server:
  port: 8080

spring:
  application:
    name: dau-viet-backend
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: []
  seed:
    enabled: false
  security:
    # HS256 signing secret — set JWT_SECRET (>= 32 bytes) outside local dev.
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl-seconds: 900
    refresh-token-ttl-seconds: 1209600
