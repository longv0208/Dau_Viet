server:
  port: 8080
spring:
  servlet:
    multipart:
      # 16/18MB — self-contained HTML animation files cap at ~15MB (with
      # inline data-URI media), so the generic 10MB multipart cap is too small.
      max-file-size: 16MB
      max-request-size: 18MB
  application:
    name: dau-viet-backend
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: ${MAIL_ENABLED:false}

app:
  cors:
    allowed-origins: []
  seed:
    enabled: false
  security:
    # HS256 signing secret — set JWT_SECRET (>= 32 bytes) outside local dev.
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl-seconds: 900
    refresh-token-ttl-seconds: 1209600


dauviet:
  shop:
    # ISLAND-BE-01: true = cho phép mua vật phẩm shop Đảo Di Sản.
    enabled: ${DAUVIET_SHOP_ENABLED:true}
  energy:
    # GAME-02 rollout flag (FIX 3): false = safe default for prod/dev while
    # GAME-03 Flutter chưa xử lý ENERGY_DEPLETED. Bật qua env
    # DAUVIET_ENERGY_ENABLED=true hoặc profile riêng khi mobile đã sẵn sàng.
    enabled: ${DAUVIET_ENERGY_ENABLED:false}
  assets:
    # Local-dev upload dir; production swaps to object storage behind the same contentUrl.
    dir: ${DAUVIET_ASSETS_DIR:data/assets}
  animations:
    html:
      # Hard cap for self-contained .html uploads (15MB default).
      max-bytes: ${DAUVIET_ANIMATION_HTML_MAX_BYTES:15728640}

  auth:
    otp:
      ttl-seconds: ${DAUVIET_OTP_TTL_SECONDS:300}
      resend-cooldown-seconds: ${DAUVIET_OTP_RESEND_COOLDOWN_SECONDS:60}
      max-attempts: ${DAUVIET_OTP_MAX_ATTEMPTS:5}
      # false → LoggingOtpSender (local/test fallback): logs the OTP code
      # only when spring profile "local" is active. Production MUST set
      # MAIL_ENABLED=true with real SMTP via spring.mail.* / MAIL_* env.
      mail-enabled: ${MAIL_ENABLED:false}
      sender-address: ${MAIL_SENDER:no-reply@dauviet.app}
    google:
      # Comma-separated OAuth client-id whitelist for idToken aud claim.
      # Empty → /auth/google returns 503 FEATURE_DISABLED.
      client-ids: ${GOOGLE_CLIENT_IDS:}
